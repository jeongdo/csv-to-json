name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve module graph
        run: go mod tidy

      - name: Export module metadata
        uses: actions/upload-artifact@v4
        with:
          name: module-metadata
          path: |
            go.mod
            go.sum
          if-no-files-found: error

      - name: Test converter
        run: go test .

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Windows desktop app
        run: wails build -clean

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CsvToJson-windows
          path: build/bin/CsvToJson.exe
          if-no-files-found: error
