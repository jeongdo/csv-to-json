name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve module graph
        run: go mod tidy

      - name: Pin resolved module metadata
        shell: pwsh
        run: |
          $changes = git status --porcelain -- go.mod go.sum
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "build: pin Go module graph"
            git push origin HEAD:main
          }

      - name: Test converter
        run: go test .

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Windows desktop app
        run: wails build -clean

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CsvToJson-windows
          path: build/bin/CsvToJson.exe
          if-no-files-found: error
