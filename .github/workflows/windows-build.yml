name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          Write-Host "=== Go ==="
          go version
          Write-Host "=== GOROOT ==="
          Write-Host $env:GOROOT
          Write-Host "=== Node ==="
          node --version

      - name: Validate frontend JavaScript
        run: node --check frontend/dist/app.js

      - name: Download dependencies
        run: go mod download




      - name: Test converter
        run: go test -cover .

      - name: Vet Go code
        run: go vet .

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          $gopath = go env GOPATH
          Write-Host "GOPATH: $gopath"
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows desktop app
        run: |
          $gopath = go env GOPATH
          $env:Path = "$gopath\bin;C:\DevTools\go-path\bin;" + $env:Path
          wails build -clean

      - name: Verify executable
        run: |
          if (-not (Test-Path "build/bin/CsvToJson.exe")) {
            throw "CsvToJson.exe was not produced"
          }
          Get-Item "build/bin/CsvToJson.exe" | Format-List Name,Length,LastWriteTime
          Get-FileHash "build/bin/CsvToJson.exe" -Algorithm SHA256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CsvToJson-windows
          path: build/bin/CsvToJson.exe
          if-no-files-found: error
